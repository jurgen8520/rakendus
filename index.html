<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f5f6">
  <title>Jürgeni kaardirakendus</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="./css/styles.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="./js/app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <div id="map" aria-label="Interaktiivne kaart"></div>
    <section class="map-heading" aria-label="Kaardi pealkiri">
      <div class="eyebrow">KAARDIRAKENDUS</div>
      <h1 id="app-title">Minu kaart</h1>
      <p id="app-description">Vali paremal kuvatavad andmekihid.</p>
    </section>
    <div id="app-status" class="app-status" role="status" aria-live="polite">Laadin kaardikihte…</div>
  </main>
  <noscript>Selle kaardirakenduse kasutamiseks peab JavaScript olema lubatud.</noscript>
</body>
</html>
